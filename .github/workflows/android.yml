name: Android CI Build

on:
  push:
    paths:
      - 'source.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Unzip Source Code
      run: unzip -o source.zip -d project/

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd project
        chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        cd project
        ./gradlew assembleDebug

    - name: Send APK to Telegram
      if: success()
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        APK_PATH=$(find project/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        if [ -f "$APK_PATH" ]; then
          curl -F chat_id="$CHAT_ID"                -F document=@"$APK_PATH"                -F caption="✅ আপনার অ্যান্ড্রয়েড APK সফলভাবে বিল্ড হয়েছে!"                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
        else
          echo "APK file not found!"
          exit 1
        fi

    - name: Send Failure Notification to Telegram
      if: failure()
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -F chat_id="$CHAT_ID"              -F text="❌ দুঃখিত, আপনার প্রজেক্ট বিল্ড করতে সমস্যা হয়েছে! ক্র্যাশ বা এরর লগ চেক করুন।"              "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
