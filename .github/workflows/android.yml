name: Android CI Build

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download Source Zip
      run: |
        curl -L -o source.zip "${{ github.event.client_payload.file_url }}"

    - name: Extract Project
      run: |
        mkdir temp
        unzip -q source.zip -d temp
        # ফোল্ডারের ভেতর প্রজেক্ট থাকলে তা রুট ডিরেক্টরিতে আনবে
        ROOT_DIR=$(find temp -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ -n "$ROOT_DIR" ]; then
          cp -r $ROOT_DIR/* .
        else
          cp -r temp/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradlew Executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Send APK to Telegram
      if: success()
      run: |
        APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
        if [ -f "$APK_PATH" ]; then
          curl -F chat_id="${{ github.event.client_payload.chat_id }}" \
               -F document=@"$APK_PATH" \
               -F caption="✅ আপনার LibreTube APK সফলভাবে তৈরি হয়েছে!" \
               "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument"
        fi

    - name: Send Failure Notification
      if: failure()
      run: |
        curl -F chat_id="${{ github.event.client_payload.chat_id }}" \
             -F text="❌ দুঃখিত! প্রজেক্ট বিল্ড করতে সমস্যা হয়েছে।" \
             "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage"
